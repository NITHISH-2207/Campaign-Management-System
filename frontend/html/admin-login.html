<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - ChangeWave Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="css/common.css" rel="stylesheet">
    <style>
        :root {
            --black: #0a0a0a;
            --dark-grey: #1a1a1a;
            --medium-grey: #2d2d2d;
            --light-grey: #6b6b6b;
            --lighter-grey: #e5e5e5;
            --white: #ffffff;
            --off-white: #f5f5f5;
            --brown: #8B6B4A;
            --light-brown: #A67C52;
            --dark-brown: #6B4423;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--black);
            color: var(--white);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .admin-login-card {
            background: var(--dark-grey);
            border: 1px solid rgba(139, 107, 74, 0.2);
            border-radius: 20px;
            padding: 45px 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .admin-badge {
            display: inline-block;
            background: rgba(139, 107, 74, 0.2);
            color: var(--light-brown);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 15px;
            border: 1px solid rgba(139, 107, 74, 0.3);
        }

        .admin-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--white) 0%, var(--light-brown) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .admin-subtitle {
            color: var(--light-grey);
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        .form-control {
            background: var(--medium-grey);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--white);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.95rem;
        }

        .form-control:focus {
            background: var(--medium-grey);
            border-color: var(--light-brown);
            color: var(--white);
            box-shadow: 0 0 0 3px rgba(166, 124, 82, 0.2);
        }

        .btn-admin-login {
            background: linear-gradient(135deg, var(--brown) 0%, var(--light-brown) 100%);
            color: var(--white);
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            width: 100%;
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        .btn-admin-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(139, 107, 74, 0.4);
            color: var(--white);
        }

        .alert-custom {
            display: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .admin-notice {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.85rem;
            color: var(--light-grey);
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="admin-login-card">
        <div class="text-center">
            <span class="admin-badge"><i class="fas fa-user-shield me-2"></i>Admin Access Portal</span>
            <h1 class="admin-title">ChangeWave Admin</h1>
            <p class="admin-subtitle">Log in to review and approve platform campaigns</p>
        </div>

        <div id="loginAlert" class="alert alert-danger alert-custom"></div>

        <form id="adminLoginForm">
            <div class="mb-3">
                <label for="adminEmail" class="form-label text-light small fw-bold">Admin Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-secondary"><i
                            class="fas fa-envelope"></i></span>
                    <input type="email" id="adminEmail" class="form-control" placeholder="admin@changewave.com" required
                        value="admin@changewave.com">
                </div>
            </div>

            <div class="mb-4">
                <label for="adminPassword" class="form-label text-light small fw-bold">Admin Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-secondary"><i
                            class="fas fa-lock"></i></span>
                    <input type="password" id="adminPassword" class="form-control" placeholder="••••••••" required
                        value="Admin@12345">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-admin-login">
                <i class="fas fa-sign-in-alt me-2"></i>Log In to Admin Dashboard
            </button>
        </form>

        <div class="admin-notice">
            <i class="fas fa-lock me-1"></i> Predefined Admin Access Only. Public registration disabled.
        </div>
    </div>

    <script src="js/common/auth.js"></script>
    <script>
        const API_BASE_URL = (window.location.origin.includes('localhost') || window.location.origin.includes('127.0.0.1'))
            ? 'http://localhost:3000/api'
            : 'http://localhost:3000/api';

        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertEl = document.getElementById('loginAlert');
            const submitBtn = document.getElementById('submitBtn');
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Authenticating...';
            alertEl.style.display = 'none';

            try {
                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    if (data.user.role !== 'admin') {
                        alertEl.textContent = 'Access Denied: Only predefined Admin accounts can log in here.';
                        alertEl.style.display = 'block';
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Log In to Admin Dashboard';
                        return;
                    }

                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));

                    alertEl.className = 'alert alert-success alert-custom';
                    alertEl.textContent = 'Authentication successful! Redirecting to Admin Dashboard...';
                    alertEl.style.display = 'block';

                    setTimeout(() => {
                        window.location.href = 'admin-dashboard.html';
                    }, 1000);
                } else {
                    alertEl.className = 'alert alert-danger alert-custom';
                    alertEl.textContent = data.error || data.message || 'Invalid admin credentials';
                    alertEl.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Log In to Admin Dashboard';
                }
            } catch (error) {
                console.error('Admin login error:', error);
                alertEl.className = 'alert alert-danger alert-custom';
                alertEl.textContent = 'Connection error. Please verify the backend server is running.';
                alertEl.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Log In to Admin Dashboard';
            }
        });
    </script>
</body>

</html>
