<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Take Survey - ChangeWave</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/navbar.css">
    <style>
        :root {
            --black: #0a0a0a;
            --dark-grey: #1a1a1a;
            --medium-grey: #2d2d2d;
            --light-grey: #a0a0a0;
            --lighter-grey: #e5e5e5;
            --white: #ffffff;
            --brown: #8B6B4A;
            --light-brown: #A67C52;
            --gradient-gold: linear-gradient(135deg, #8B6B4A 0%, #A67C52 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif !important;
            background-color: var(--black) !important;
            color: var(--white) !important;
            line-height: 1.6;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 30%, rgba(139, 107, 74, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(166, 124, 82, 0.06) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        .take-survey-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 24px 60px;
        }

        .back-nav {
            margin-bottom: 24px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--light-grey);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        .back-btn:hover {
            color: var(--light-brown);
        }

        /* Header Card */
        .survey-header-card {
            background: var(--dark-grey);
            border: 1px solid rgba(139, 107, 74, 0.25);
            border-radius: 16px;
            padding: 28px 32px;
            margin-bottom: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .survey-header-card h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--white);
            margin-bottom: 8px;
        }

        .survey-header-card p {
            color: var(--light-grey);
            font-size: 1rem;
            margin-bottom: 20px;
        }

        /* Progress Bar */
        .progress-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--light-brown);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .progress-track {
            width: 100%;
            height: 8px;
            background: #252525;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--gradient-gold);
            transition: width 0.4s ease;
            border-radius: 4px;
        }

        /* Question Card */
        .question-card {
            background: var(--dark-grey);
            border: 1px solid rgba(139, 107, 74, 0.25);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .question-card h3 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--white);
            margin-bottom: 24px;
            line-height: 1.5;
        }

        /* Rating / Scale options */
        .rating-scale {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .rating-option {
            flex: 1;
            min-width: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px 8px;
            background: #252525;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .rating-option:hover {
            border-color: var(--light-brown);
            background: rgba(139, 107, 74, 0.15);
        }

        .rating-option input[type="radio"] {
            display: none;
        }

        .rating-option input[type="radio"]:checked + .rating-label {
            background: var(--gradient-gold);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(139, 107, 74, 0.4);
        }

        .rating-label {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--lighter-grey);
            transition: all 0.3s ease;
        }

        .scale-labels {
            display: flex;
            justify-content: space-between;
            color: var(--light-grey);
            font-size: 0.85rem;
            font-weight: 500;
            margin-top: 8px;
        }

        /* Options */
        .multiple-choice-options, .yes-no-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .mc-option, .yn-option {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 20px;
            background: #252525;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--lighter-grey);
            font-size: 0.95rem;
        }

        .mc-option:hover, .yn-option:hover {
            border-color: var(--light-brown);
            background: rgba(139, 107, 74, 0.15);
            color: var(--white);
        }

        .mc-option input[type="radio"], .yn-option input[type="radio"] {
            accent-color: var(--brown);
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .text-response {
            width: 100%;
            background: #252525;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 16px;
            color: var(--white);
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .text-response:focus {
            border-color: var(--brown);
            box-shadow: 0 0 0 3px rgba(139, 107, 74, 0.2);
        }

        /* Nav Action Buttons */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 24px;
        }

        .btn-prev {
            padding: 12px 28px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--lighter-grey);
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-prev:hover:not(:disabled) {
            border-color: var(--light-brown);
            color: var(--white);
        }

        .btn-prev:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-next, .btn-submit {
            padding: 12px 32px;
            background: var(--gradient-gold);
            color: var(--white);
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(139, 107, 74, 0.3);
        }

        .btn-next:hover, .btn-submit:hover {
            background: linear-gradient(135deg, #a67c52 0%, #c49666 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(139, 107, 74, 0.5);
        }

        /* Completion Card */
        .completion-message {
            text-align: center;
            padding: 60px 30px;
            background: var(--dark-grey);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
        }

        .completion-message .success-icon {
            width: 70px;
            height: 70px;
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            margin: 0 auto 24px;
            border: 2px solid rgba(34, 197, 94, 0.4);
        }

        .completion-message h2 {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--white);
            margin-bottom: 12px;
        }

        .completion-message p {
            color: var(--light-grey);
            font-size: 1rem;
            margin-bottom: 24px;
        }

        .return-btn {
            padding: 12px 28px;
            background: var(--gradient-gold);
            color: var(--white);
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .return-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(139, 107, 74, 0.5);
        }

        @media (max-width: 600px) {
            .rating-scale {
                flex-wrap: wrap;
            }
            .rating-option {
                min-width: 40px;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar"></nav>

    <main class="take-survey-container">
        <div class="back-nav">
            <a href="survey-participation.html" class="back-btn">
                <i class="fas fa-arrow-left"></i> Back to Impact Surveys
            </a>
        </div>

        <div id="survey-container">
            <!-- Header Card -->
            <div class="survey-header-card" id="survey-header-card" style="display: none;">
                <h1 id="survey-title">Loading Survey...</h1>
                <p id="survey-description"></p>

                <div class="progress-container">
                    <div class="progress-text">
                        <span>Question <span id="current-question">1</span> of <span id="total-questions">1</span></span>
                        <span>Impact Survey</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                </div>
            </div>

            <!-- Dynamic Question Container -->
            <div id="question-container">
                <div class="question-card" style="text-align: center; padding: 60px 20px;">
                    <i class="fas fa-spinner fa-spin fa-2x" style="color: var(--brown); margin-bottom: 16px;"></i>
                    <p style="color: var(--light-grey);">Loading survey questions...</p>
                </div>
            </div>

            <!-- Navigation Buttons -->
            <div class="nav-buttons" id="nav-buttons-container">
                <button id="prev-btn" class="btn-prev" onclick="surveyTaker.previousQuestion()" disabled>
                    <i class="fas fa-chevron-left me-1"></i> Previous
                </button>
                <button id="next-btn" class="btn-next" onclick="surveyTaker.nextQuestion()">
                    Next <i class="fas fa-chevron-right ms-1"></i>
                </button>
                <button id="submit-btn" class="btn-submit" onclick="surveyTaker.submitSurvey()" style="display: none;">
                    <i class="fas fa-paper-plane me-1"></i> Submit Survey
                </button>
            </div>
        </div>
    </main>

    <script src="js/common/auth.js"></script>
    <script src="js/common/navigation.js"></script>
    <script src="js/surveys/take-survey.js"></script>
</body>

</html>
