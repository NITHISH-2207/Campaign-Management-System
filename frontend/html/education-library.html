<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Education Library - ChangeWave</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --black: #0a0a0a;
            --dark-grey: #1a1a1a;
            --medium-grey: #2d2d2d;
            --light-grey: #6b6b6b;
            --lighter-grey: #e5e5e5;
            --white: #ffffff;
            --off-white: #f5f5f5;
            --brown: #8B6B4A;
            --light-brown: #A67C52;
            --dark-brown: #6B4423;
            --orange: #F97316;
            --orange-light: #FB923C;
            --purple: #8B5CF6;
            --purple-light: #A78BFA;
            --gradient-primary: linear-gradient(135deg, var(--purple) 0%, var(--purple-light) 100%);
            --gradient-purple: linear-gradient(135deg, var(--purple) 0%, var(--purple-light) 100%);
            --gradient-success: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            --gradient-warning: linear-gradient(135deg, var(--orange) 0%, var(--orange-light) 100%);
            --gradient-info: linear-gradient(135deg, #2193b0 0%, #6dd5ed 100%);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--black);
            color: var(--white);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Background Ambient Glow matching create-education-module.html */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(circle at 20% 50%, rgba(139, 92, 246, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(107, 68, 35, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        /* Main Container */
        .education-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 120px 40px 80px;
            position: relative;
        }

        /* Header Section */
        .education-header {
            text-align: center;
            margin-bottom: 50px;
            animation: fadeInDown 0.8s ease-out;
        }

        .education-header h1 {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 15px;
            background: linear-gradient(135deg, var(--white) 0%, var(--purple-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .education-header p {
            font-size: 18px;
            color: var(--lighter-grey);
            max-width: 650px;
            margin: 0 auto;
        }

        /* Buttons */
        .btn, .btn-primary {
            background: var(--gradient-primary);
            color: white;
            padding: 14px 32px;
            border: none;
            border-radius: 25px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.3);
        }

        .btn:hover, .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(139, 92, 246, 0.5);
            color: white;
        }

        /* Search and Filter Section */
        .search-filter-section {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 20px;
            margin-bottom: 50px;
            background: var(--dark-grey);
            padding: 25px 30px;
            border-radius: 25px;
            border: 1px solid rgba(139, 92, 246, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        .search-box {
            position: relative;
            background: var(--medium-grey);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 18px;
            overflow: hidden;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
        }

        .search-box:focus-within {
            border-color: var(--purple);
            background: rgba(139, 92, 246, 0.05);
            box-shadow: 0 5px 15px rgba(139, 92, 246, 0.2);
            transform: translateY(-2px);
        }

        .search-box input {
            flex: 1;
            padding: 14px 20px;
            border: none;
            background: transparent;
            color: var(--white);
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            outline: none;
        }

        .search-box input::placeholder {
            color: var(--light-grey);
        }

        .search-box button {
            padding: 14px 24px;
            background: var(--gradient-primary);
            border: none;
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .search-box button:hover {
            opacity: 0.9;
        }

        .filter-options select {
            padding: 14px 24px;
            background: var(--medium-grey);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 18px;
            color: var(--white);
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
            height: 100%;
        }

        .filter-options select:focus,
        .filter-options select:hover {
            border-color: var(--purple);
            background: rgba(139, 92, 246, 0.05);
            box-shadow: 0 5px 15px rgba(139, 92, 246, 0.2);
        }

        .filter-options select option {
            background: var(--medium-grey);
            color: var(--white);
        }

        /* Loading and Error States */
        #loadingIndicator {
            text-align: center;
            padding: 60px 40px;
            color: var(--lighter-grey);
            font-size: 16px;
        }

        #errorMessage {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #EF4444;
            padding: 20px 30px;
            border-radius: 20px;
            text-align: center;
            margin: 40px auto;
            max-width: 600px;
        }

        /* Modules Grid */
        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
            margin-bottom: 60px;
            animation: fadeInUp 0.8s ease-out 0.3s both;
        }

        /* Module Card Styling */
        .module-card {
            background: var(--dark-grey) !important;
            border: 1px solid rgba(139, 92, 246, 0.2) !important;
            border-radius: 30px !important;
            overflow: hidden !important;
            transition: all 0.3s ease !important;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3) !important;
            padding: 30px !important;
            display: flex !important;
            flex-direction: column !important;
            position: relative !important;
        }

        .module-card:hover {
            transform: translateY(-8px) !important;
            border-color: var(--purple) !important;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4), 0 0 25px rgba(139, 92, 246, 0.2) !important;
        }

        .module-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--gradient-primary);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s ease;
        }

        .module-card:hover::before {
            transform: scaleX(1);
        }

        .module-card h3 {
            font-size: 22px !important;
            color: var(--white) !important;
            margin-bottom: 15px !important;
            font-weight: 700 !important;
        }

        .module-card p {
            color: var(--lighter-grey) !important;
            font-size: 15px !important;
            line-height: 1.6 !important;
            margin-bottom: 20px !important;
        }

        .module-meta span {
            color: var(--lighter-grey) !important;
            font-size: 13px !important;
        }

        .start-module-btn {
            background: var(--gradient-primary) !important;
            color: white !important;
            padding: 12px 25px !important;
            border: none !important;
            border-radius: 20px !important;
            font-size: 14px !important;
            font-weight: 600 !important;
            cursor: pointer !important;
            transition: all 0.3s ease !important;
            margin-top: 15px !important;
            width: 100% !important;
        }

        .start-module-btn:hover {
            transform: translateY(-2px) !important;
            box-shadow: 0 5px 15px rgba(139, 92, 246, 0.4) !important;
        }

        .view-stats-btn, .edit-module-btn {
            background: var(--medium-grey) !important;
            border: 1px solid rgba(139, 92, 246, 0.2) !important;
            color: var(--lighter-grey) !important;
            border-radius: 15px !important;
            padding: 10px 18px !important;
            font-weight: 600 !important;
            cursor: pointer !important;
            transition: all 0.3s ease !important;
        }

        .view-stats-btn:hover, .edit-module-btn:hover {
            border-color: var(--purple) !important;
            color: var(--white) !important;
            transform: translateY(-2px) !important;
        }

        /* Empty State Card Styling (Overrides library.js inline light styling) */
        .no-modules {
            grid-column: 1 / -1 !important;
            text-align: center !important;
            padding: 60px 40px !important;
            background: var(--dark-grey) !important;
            border: 1px solid rgba(139, 92, 246, 0.2) !important;
            border-radius: 30px !important;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3) !important;
            color: var(--white) !important;
            animation: fadeInUp 0.8s ease-out both !important;
        }

        .no-modules h3 {
            color: var(--white) !important;
            font-size: 24px !important;
            font-weight: 700 !important;
            margin-bottom: 15px !important;
        }

        .no-modules p {
            color: var(--lighter-grey) !important;
            font-size: 16px !important;
            margin-bottom: 25px !important;
        }

        .no-modules .btn,
        .no-modules .btn-primary {
            background: var(--gradient-primary) !important;
            color: white !important;
            border-radius: 25px !important;
            padding: 14px 32px !important;
            font-weight: 600 !important;
            text-decoration: none !important;
            display: inline-flex !important;
            align-items: center !important;
            gap: 8px !important;
            border: none !important;
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.3) !important;
            transition: all 0.3s ease !important;
        }

        .no-modules .btn:hover,
        .no-modules .btn-primary:hover {
            transform: translateY(-3px) !important;
            box-shadow: 0 15px 35px rgba(139, 92, 246, 0.5) !important;
        }

        /* Coming Soon Section */
        .coming-soon {
            text-align: center;
            padding: 60px 40px;
            background: var(--dark-grey);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 30px;
            margin-top: 60px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }

        .coming-soon::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.08) 0%, transparent 70%);
            pointer-events: none;
        }

        .coming-soon h2 {
            font-size: 32px;
            margin-bottom: 15px;
            position: relative;
            z-index: 1;
            background: linear-gradient(135deg, var(--white) 0%, var(--purple-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .coming-soon p {
            font-size: 16px;
            color: var(--lighter-grey);
            position: relative;
            z-index: 1;
        }

        /* Module Viewer Modal */
        .module-viewer {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            animation: fadeIn 0.3s ease;
        }

        .viewer-content {
            background: var(--dark-grey);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 30px;
            max-width: 900px;
            max-height: 90vh;
            width: 100%;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            animation: slideUp 0.3s ease;
        }

        .close-viewer {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(139, 92, 246, 0.3);
            color: var(--white);
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .close-viewer:hover {
            background: var(--purple);
            transform: rotate(90deg) scale(1.1);
        }

        #moduleContent {
            padding: 50px 40px 40px;
            color: var(--white);
        }

        /* Keyframe Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Responsive Design */
        @media (max-width: 1200px) {
            .education-container {
                padding: 100px 30px 60px;
            }

            .modules-grid {
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
                gap: 25px;
            }
        }

        @media (max-width: 768px) {
            .education-container {
                padding: 100px 20px 40px;
            }

            .education-header h1 {
                font-size: 32px;
            }

            .education-header p {
                font-size: 16px;
            }

            .search-filter-section {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .modules-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .coming-soon {
                padding: 40px 20px;
            }

            .coming-soon h2 {
                font-size: 26px;
            }

            .viewer-content {
                margin: 20px;
            }

            #moduleContent {
                padding: 40px 20px 20px;
            }
        }
    </style>
</head>

<body>
    <!-- Navigation will be inserted by navigation.js -->
    <nav class="navbar"></nav>

    <!-- Main Content -->
    <main class="education-container">
        <!-- Header Section -->
        <div class="education-header">
            <h1>Educational Content Library</h1>
            <p>Learn about important social causes through interactive modules and quizzes</p>
        </div>

        <!-- Search and Filter -->
        <div class="search-filter-section">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search modules...">
                <button type="button" onclick="searchModules()">
                    <i class="fas fa-search"></i>
                </button>
            </div>
            <div class="filter-options">
                <select id="categoryFilter" onchange="filterModules()">
                    <option value="">All Categories</option>
                    <option value="climate">Climate Change</option>
                    <option value="social">Social Justice</option>
                    <option value="health">Health Awareness</option>
                    <option value="education">Education</option>
                </select>
            </div>
        </div>

        <!-- Loading indicator -->
        <div id="loadingIndicator" style="display: none;">
            <p><i class="fas fa-spinner fa-spin me-2"></i> Loading modules...</p>
        </div>

        <!-- Error message container -->
        <div id="errorMessage" style="display: none;"></div>

        <!-- Education Modules Grid -->
        <div class="modules-grid" id="modulesGrid">
            <!-- Dynamic modules will be loaded here -->
        </div>

        <!-- Coming Soon Section -->
        <div class="coming-soon">
            <h2>More Modules Coming Soon!</h2>
            <p>We're constantly adding new educational content. Check back regularly for updates.</p>
        </div>
    </main>

    <!-- Module Viewer Modal (Hidden by default) -->
    <div id="moduleViewer" class="module-viewer" style="display: none;">
        <div class="viewer-content">
            <button class="close-viewer" onclick="closeModule()">&times;</button>
            <div id="moduleContent">
                <!-- Dynamic content will be loaded here -->
            </div>
        </div>
    </div>

    <script src="js/common/auth.js"></script>
    <script src="js/common/navigation.js"></script>
    <script src="js/education/library.js"></script>
</body>

</html>
